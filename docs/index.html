<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mini Adam – Tesla-Navi ferngesteuert</title>
  <meta name="description" content="Ein liebevolles 3D-Fan-Spiel rund um SkylineTV LIVE: Mini Adam fährt den schwarzen Tesla über die Autobahn, der Chat steuert das Navi fern.">
  <meta name="theme-color" content="#0b0c0f">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2311121a'/%3E%3Ccircle cx='17' cy='32' r='7' fill='%23e8212e'/%3E%3Ctext x='28' y='40' font-family='Arial' font-weight='700' font-size='20' fill='white'%3ELIVE%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <div id="loading">
      <div class="load-card">
        <div class="nomi-orb"><span class="eye"></span><span class="eye"></span></div>
        <h1>Mini Adam</h1>
        <p class="load-sub">Tesla-Navi ferngesteuert</p>
        <p class="load-status">NOMI wird geweckt … alle Handynetze werden gebündelt …</p>
      </div>
    </div>
    <noscript><div class="load-card"><p>Für dieses Spiel wird JavaScript benötigt.</p></div></noscript>
  </div>
  <script>
    // Erst den Ladebildschirm zeigen, dann das (große) Spiel laden.
    requestAnimationFrame(function () {
      setTimeout(function () {
        var s = document.createElement('script');
        s.src = 'game.js';
        s.onerror = function () {
          document.querySelector('.load-status').textContent = 'Das Spiel konnte nicht geladen werden (game.js fehlt).';
        };
        document.body.appendChild(s);
      }, 40);
    });
  </script>
</body>
</html>
