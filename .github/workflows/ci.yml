# Prüft jeden Pull Request und jeden Stand von main – und veröffentlicht main auf GitHub Pages:
# - die Kartendaten (src/map/data.js, shapes.js) sind genau das, was `npm run map` aus tools/map/netz.json erzeugt,
# - das Spiel-Bundle docs/game.js wird hier aus src/ gebaut (`npm run build`); es liegt nicht im Repo,
#   damit Pull Requests sich nicht mehr gegenseitig in dieser einen großen Datei in die Quere kommen,
# - alle Prüfstände (`npm test`) laufen durch,
# - und, als eigener Job daneben, das gebaute Spiel startet in Chromium und fährt (`npm run smoke`).
# Nur wenn beides auf main grün ist, geht genau dieses gebaute docs/ live (Job Pages).
# Dafür muss unter Settings → Pages → Build and deployment die Source auf „GitHub Actions“ stehen.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Pull Requests: ein neuer Push bricht den alten Lauf ab. main: jeder Merge läuft zu Ende und geht live.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pruefen:
    name: Build und Prüfstände
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten
        run: npm ci

      - name: Kartendaten passen zu netz.json
        run: |
          npm run map
          if ! git diff --quiet -- src/map/data.js src/map/shapes.js; then
            echo "::error::src/map/data.js oder shapes.js passt nicht zu tools/map/netz.json – bitte 'npm run map' ausführen und das Ergebnis committen."
            git diff --stat -- src/map/data.js src/map/shapes.js
            exit 1
          fi

      - name: Spiel bauen (docs/game.js)
        run: npm run build

      - name: Prüfstände
        run: npm test

      - name: docs/ für GitHub Pages bereitlegen
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

  browser:
    name: Browser-Probe
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten
        run: npm ci

      - name: Spiel bauen (docs/game.js)
        run: npm run build

      - name: Chromium
        run: npx playwright install --with-deps chromium

      - name: Spiel im Browser anfahren
        run: SMOKE_BILD=browser-probe.png npm run smoke

      - name: Bild der Probe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-probe
          path: browser-probe.png
          if-no-files-found: ignore

  pages:
    name: Pages
    needs: [pruefen, browser]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    # nie zwei Veröffentlichungen gleichzeitig; eine wartende wird von der nächsten ersetzt, eine laufende läuft zu Ende
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Veröffentlichen
        id: deploy
        uses: actions/deploy-pages@v4
